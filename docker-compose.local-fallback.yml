services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edutech-database
    mem_limit: 2048m
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-EduTech_Fallback_2026!}
      - MSSQL_PID=Developer
      - MSSQL_MEMORY_LIMIT_MB=1200
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always
    networks:
      - edutech-net

  backend:
    image: ${DOCKER_USERNAME}/3t-edu-tech-backend:latest
    container_name: edutech-backend
    mem_limit: 768m
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # - DB_SERVER=${DB_SERVER}
      # - DB_USER=${DB_USER}
      # - DB_PASSWORD=${DB_PASSWORD}
      # - DB_NAME=${DB_NAME}
      - AI_SERVICE_PORT=2111
      - REDIS_URL=redis://edutech-redis:6379
      # Thêm các biến môi trường khác cần thiết ở đây, hoặc dùng env_file
    env_file:
      - ./3t-edu-tech-backend/.env
    restart: always
    depends_on:
      - database
      - redis
    networks:
      - edutech-net

  ai-service:
    image: ${DOCKER_USERNAME}/3t-edu-tech-ai-service:latest
    container_name: edutech-ai-service
    mem_limit: 2048m
    ports:
      - "2111:2111"
    environment:
      - PORT=2111
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - ./ai-service/.env
    restart: always
    networks:
      - edutech-net
    volumes:
      - ./ai-service/data:/app/data # Persist ChromaDB or document data if needed

  redis:
    image: redis:7-alpine
    container_name: edutech-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    networks:
      - edutech-net

  frontend:
    image: ${DOCKER_USERNAME}/3t-edu-tech-frontend:latest
    container_name: edutech-frontend
    mem_limit: 512m
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
    networks:
      - edutech-net

networks:
  edutech-net:
    driver: bridge

volumes:
  mssql-data:
  redis-data:
