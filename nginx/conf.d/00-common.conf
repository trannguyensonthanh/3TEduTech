# =============================================================================
# 00-common.conf — khai báo dùng chung ở tầng http
# =============================================================================
# [THÊM 18/08/2026] Tách ra khỏi nginx.conf cũ.
#
# Nginx nạp MỌI tệp `*.conf` trong /etc/nginx/conf.d theo thứ tự bảng chữ cái,
# và các tệp đó nằm ở NGỮ CẢNH `http`. Vì vậy `map` và `upstream` — hai directive
# chỉ hợp lệ ở tầng http — phải nằm ở đây chứ không nằm trong tệp server.
#
# Tên bắt đầu bằng `00-` để nó luôn được nạp trước, cho dễ đọc khi debug (thứ tự
# thật ra không quan trọng với `map`/`upstream`, nhưng đọc log dễ hơn nhiều).
#
# ★ VÌ SAO TÁCH: tệp server (default.conf) sẽ bị THAY khi bật HTTPS
#   (scripts/bat-https.sh). Nếu `map` và `upstream` nằm trong đó thì mỗi lần đổi
#   là phải chép lại chúng — và chép tay là chỗ sinh lỗi.
# =============================================================================

# ---------------------------------------------------------------
# Ánh xạ cho WebSocket (Socket.IO)
#
# Nginx mặc định KHÔNG chuyển tiếp header Upgrade — nó là "hop-by-hop header",
# theo chuẩn HTTP thì proxy phải tự xử lý chứ không truyền tiếp. Thiếu block
# map này, mọi kết nối WebSocket bị nâng cấp hụt và Socket.IO tụt vĩnh viễn
# xuống long-polling: vẫn "chạy" nên rất khó phát hiện, chỉ là tốn gấp nhiều
# lần tài nguyên và trễ hơn hẳn.
# ---------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_api {
    server edutech-backend:5000;
}

# =============================================================================
# ⚠️ KHÔNG khai báo `upstream ai_service` ở đây.
#
# ★ ĐÂY LÀ LỖI ĐÃ LÀM CHẾT CẢ CONTAINER FRONTEND TRONG BẢN CŨ.
#
# nginx.conf cũ có:
#
#     upstream ai_service {
#         server GPU_EC2_2_PRIVATE_IP:2111;   # TODO: thay bằng IP thật
#     }
#
# Nginx PHÂN GIẢI tên máy của upstream NGAY LÚC NẠP CẤU HÌNH, chứ không phải
# lúc có request. `GPU_EC2_2_PRIVATE_IP` không phải tên máy có thật, nên nginx
# thoát ngay với:
#
#     nginx: [emerg] host not found in upstream "GPU_EC2_2_PRIVATE_IP"
#
# Container frontend vào vòng lặp khởi động lại vô hạn — cả trang web sập —
# mặc dù khối `location /ai-api/` DÙNG tới upstream này đã bị comment từ Level 3.
# Comment chỗ dùng mà quên chỗ khai báo là không đủ.
#
# Và trình duyệt KHÔNG BAO GIỜ cần gọi thẳng AI Service nữa: từ Level 3, frontend
# gọi `/v1/ai/*` (backend, có JWT + giới hạn tần suất), backend mới gọi sang AI
# Service kèm khóa nội bộ. Nên upstream này không có lý do tồn tại.
#
# 👉 Nếu sau này thật sự cần proxy tới AI Service, PHẢI kèm
#    `proxy_set_header X-Internal-Api-Key ...` và một cơ chế xác thực người dùng
#    ở tầng này — nếu không là mở lại đúng lỗ hổng đã bịt.
# =============================================================================
