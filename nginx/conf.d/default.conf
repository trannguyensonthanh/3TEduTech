# =============================================================================
# default.conf — CHỈ HTTP (giai đoạn chưa có chứng chỉ SSL)
# =============================================================================
# [THÊM 18/08/2026]
#
# Dùng ngay được: truy cập bằng IP công cộng của EC2, hoặc bằng tên miền
# DuckDNS miễn phí. Khi đã xin xong chứng chỉ Let's Encrypt, chạy:
#
#     sudo bash scripts/bat-https.sh <ten-mien-cua-ban>
#
# script đó sẽ thay tệp này bằng bản có HTTPS.
#
# ⚠️ ĐỪNG sửa các `location` ngay trong tệp này — chúng nằm ở locations.inc và
#    được cả bản HTTP lẫn bản HTTPS dùng chung. Sửa ở đây thì bật HTTPS xong là
#    thay đổi biến mất.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # ★ `_` là tên máy chủ CATCH-ALL, cố ý dùng thay cho một tên miền cụ thể.
    #
    # Nhờ vậy cùng một tệp chạy được với: IP công cộng của EC2, tên miền DuckDNS,
    # và tên miền thật sau này — không phải sửa lại mỗi lần đổi cách truy cập.
    # Bản cũ ghi cứng `server_name your-domain.com`, tức chuỗi placeholder đó đi
    # thẳng lên server thật.
    server_name _;

    # ---- Header bảo mật ----
    # Đặt ở tầng server để áp cho mọi phản hồi.
    #
    # ⚠️ `add_header` trong Nginx KHÔNG kế thừa xuống khối con nếu khối con cũng
    # có `add_header` — đây là hành vi gây nhầm nổi tiếng. Khối SPA trong
    # locations.inc có `add_header Cache-Control`, nên các header dưới đây KHÔNG
    # áp cho tệp tĩnh. Chấp nhận được: tệp .js/.css không cần X-Frame-Options.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ⚠️ KHÔNG đặt Strict-Transport-Security ở khối HTTP này.
    # HSTS bảo trình duyệt "từ nay chỉ nói chuyện với tên miền này qua HTTPS".
    # Gửi nó khi CHƯA có HTTPS sẽ khóa người dùng khỏi chính trang web, và trình
    # duyệt nhớ chỉ thị đó rất lâu — không xóa được từ phía máy chủ.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    include /etc/nginx/conf.d/locations.inc;
}
