name: 3TEduTech Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # 🌟 BẢO BỐI NÚT BẤM THỦ CÔNG: Cho phép kích hoạt deploy bằng phím bấm trực tiếp từ tab Actions trên GitHub khi bật VPS!
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Ép buộc deploy ngay lập tức lên Production Server?'
        required: false
        default: 'true'

jobs:
  # =========================================================================
  # TẦNG 1: KIỂM VỰC & CHẠY TEST TỰ ĐỘNG (CI - CONTINUOUS INTEGRATION)
  # Luôn miễn phí, luôn chạy để bảo đảm code sạch trước khi hợp nhất
  # =========================================================================
  build-and-test-backend:
    name: ⚡ CI / Backend Linter & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./3t-edu-tech-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './3t-edu-tech-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (Linter check)
        run: npm run lint
        continue-on-error: true # Cho phép qua tiếp nếu có cảnh báo style nhẹ

      # 💡 Khi bạn bắt đầu bổ sung Jest Unit Test, chỉ cần mở khóa dòng bên dưới:
      # - name: Run Unit & Integration Tests (Jest)
      #   run: npm test

  build-and-test-ai-service:
    name: 🧠 CI / AI Service Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: uv pip install --system -r pyproject.toml

      # 💡 Mở khóa khi bổ sung thư viện pytest cho Python AI:
      # - name: Run Python AI Service Tests
      #   run: pytest

  build-frontend:
    name: 🎨 CI / Frontend Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edu-ai-learning-hub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './edu-ai-learning-hub/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Vite Production Bundle
        run: npm run build

  # =========================================================================
  # TẦNG 2: ĐÓNG GÓI DOCKER & LƯU TRỮ (DOCKERIZE)
  # Luôn tự động tạo Docker Image trên Docker Hub mượt mà dù Server bị tắt!
  # =========================================================================
  dockerize:
    name: 🐳 Dockerize / Build & Push Images
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-ai-service, build-frontend]
    # Chỉ đóng gói khi push lên branch chính hoặc bấm tay workflow_dispatch
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./3t-edu-tech-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-backend:latest

      - name: Build & Push AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-ai-service:latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./edu-ai-learning-hub
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-frontend:latest

  # =========================================================================
  # TẦNG 3: TRIỂN KHAI LÊN VPS PRODUCTION (CD - CONTINUOUS DEPLOYMENT)
  # 🛡️ CẦU DAO BẢO HIỂM: Chỉ gõ cửa máy chủ nếu bật biến DEPLOY_ENABLED = true hoặc bấm nút
  # =========================================================================
  deploy-to-server:
    name: 🚀 CD / Production VPS Deploy
    runs-on: ubuntu-latest
    needs: [dockerize]
    # 🌟 ĐIỂM SỐNG CÒN: Kiểm tra biến môi trường DEPLOY_ENABLED từ GitHub Repo Variables hoặc có nút bấm workflow_dispatch
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # ✅ Khắc phục "bom ngầm": Dùng đúng tên file docker-compose.prod.yml
          source: "docker-compose.prod.yml"
          target: "/opt/3t-edu-tech"
          strip_components: 0

      - name: Remote SSH Pull & Restart Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            cd /opt/3t-edu-tech
            
            echo "📥 Pulling newest Docker Images from Docker Hub..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-ai-service:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/3t-edu-tech-frontend:latest
            
            echo "🔄 Restarting Production stack with Redis memory limitations..."
            # Sử dụng file prod chính thức cùng tùy chọn remove-orphans dọn dẹp container rác
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d
            
            echo "✨ Deployment Completed Successfully! 🚀"
